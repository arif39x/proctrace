[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "proctrace"
version = "0.1.0"
description = "Non-invasive process and OS state introspection for Python developers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# No runtime dependencies by design: the core is a compiled Rust extension.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "maturin>=1.5",
    "twine>=5.0",
]

[tool.maturin]
# Must match the #[pymodule] name in lib.rs and the package path.
module-name = "proctrace._proctrace_core"
# Install the Python wrapper alongside the compiled extension.
python-packages = ["proctrace"]
features = ["pyo3/extension-module"]
strip = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]